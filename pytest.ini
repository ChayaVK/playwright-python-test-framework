[pytest]
# Lets tests import pages, api, utils and config from the project root.
pythonpath = .
testpaths = tests
# Default options for every run. Add more on the command line, for example: pytest -n 4 --browser firefox
addopts =
    --tracing retain-on-failure
    --screenshot only-on-failure
    --video retain-on-failure
    --output test-results
    --junitxml test-results/junit.xml
    --html reports/report.html
    --self-contained-html
markers =
    smoke: quick checks of the main flows
    regression: the full set of checks
    data: data-driven tests (JSON and CSV)
    api: API tests
log_cli_level = INFO
