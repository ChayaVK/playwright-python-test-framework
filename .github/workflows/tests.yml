name: Playwright Python Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      marker:
        description: 'Marker to run, for example smoke (leave empty for all)'
        required: false
        default: ''

jobs:
  ui-tests:
    name: Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The official Playwright image already has Python, the browsers and their system libraries,
    # so the job does not need to download them. Keep the tag the same as playwright in requirements.txt.
    container:
      image: mcr.microsoft.com/playwright/python:v1.63.0-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -n auto --reruns 1 --browser ${{ matrix.browser }} ${{ inputs.marker && format('-m {0}', inputs.marker) || '' }}
        env:
          TEST_ENV: local
          HOME: /root # Firefox in the Playwright image needs a home folder owned by the current user
          # For a real app, store logins as repository secrets:
          # APP_USERNAME: ${{ secrets.APP_USERNAME }}
          # APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: report-${{ matrix.browser }}
          path: |
            reports
            test-results
          retention-days: 7
